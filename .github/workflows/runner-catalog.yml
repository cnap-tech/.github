name: Runner catalog publication

on:
  pull_request:
    paths:
      - RUNNERS.md
      - runner-catalog-manifest.json
      - runner-profiles.json
      - runner-profiles.yaml
      - script/validate_runner_catalog.rb
      - test/runner_catalog_test.rb
      - .github/workflows/runner-catalog.yml
      - .github/workflows/runner-catalog-trusted.yml
  push:
    branches: [main]
    paths:
      - RUNNERS.md
      - runner-catalog-manifest.json
      - runner-profiles.json
      - runner-profiles.yaml
      - script/validate_runner_catalog.rb
      - test/runner_catalog_test.rb
      - .github/workflows/runner-catalog.yml
      - .github/workflows/runner-catalog-trusted.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Checkout base commit for bootstrap boundary
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .base
          persist-credentials: false
      - name: Require trusted verifier on base commit
        if: github.event_name == 'pull_request'
        run: ruby script/require_trusted_catalog_workflow.rb --base-root .base
      - name: Validate public catalog contract
        run: ruby script/validate_runner_catalog.rb
