---
apiVersion: runners.akua.dev/v1alpha1
kind: RunnerProfileCatalog
metadata:
  name: akua-ci-catalog
  contractVersion: 2.0.0
  documentation: https://github.com/akua-dev/.github/blob/main/RUNNERS.md
  provenance:
    repository: akua-dev/gitops
    path: clusters/agentos/runner-platform/profiles.yaml
    revision: ca39219715c3b6723452d8be79689e73470b5810
    sha256: 5d3c88e7fa34d77209463bd39bcbad592a7d2feda751199add358d5f109bc598
capacity:
  scope: organization
  allocation: shared
  maxConcurrentJobs: 4
  queueSlo: null
  notes:
  - Capacity is shared by all three profiles; a profile label does not reserve a private
    slot.
  - Four concurrent jobs are the current safe contract. Six was only a short load
    experiment.
policy:
  requirementEnvironment:
    cpu: AKUA_CI_REQUIRED_VCPU
    memoryMiB: AKUA_CI_REQUIRED_MEMORY_MIB
    diskMiB: AKUA_CI_REQUIRED_DISK_MIB
  selection:
    safeMatch:
      resources: required-at-most-guaranteed-minimum
      capabilities: required-subset-of-guaranteed
    order:
    - akua-x64-ci-v2
    - akua-docker-ci-v2
    - akua-heavy-ci-v2
    noMatch: external-runner-or-reduce-requirements
profiles:
- id: standard-v2
  label: akua-x64-ci-v2
  class: standard
  displayName: Standard
  status: active
  minimumResources:
    vcpu: 2
    memoryMiB: 4096
    usableDiskMiB: 10240
  capabilities:
    guaranteed:
    - ordinary build and test tooling
  workload:
    recommended:
    - linting, formatting, unit tests and ordinary compilation
    - jobs that do not start containers or require large local caches
    exclusions:
    - Docker, Buildx and service containers
    - workloads whose requirements exceed the Standard guarantees
  deprecation:
    deprecated: false
    announcedAt: null
    sunsetAt: null
    replacementLabel: null
- id: docker-v2
  label: akua-docker-ci-v2
  class: docker
  displayName: Docker
  status: active
  minimumResources:
    vcpu: 4
    memoryMiB: 6144
    usableDiskMiB: 15360
  capabilities:
    guaranteed:
    - Docker
    - Buildx
    - service containers
    - privileged containers
    - ordinary build and test tooling
  workload:
    recommended:
    - Docker and Buildx image builds
    - integration tests using Docker or service containers
    exclusions:
    - workloads whose requirements exceed the Docker guarantees; use Heavy only when all Heavy bounds fit
  deprecation:
    deprecated: false
    announcedAt: null
    sunsetAt: null
    replacementLabel: null
- id: heavy-v2
  label: akua-heavy-ci-v2
  class: heavy
  displayName: Heavy
  status: active
  minimumResources:
    vcpu: 4
    memoryMiB: 7168
    usableDiskMiB: 20480
  capabilities:
    guaranteed:
    - Docker
    - Buildx
    - service containers
    - privileged containers
    - ordinary build and test tooling
  workload:
    recommended:
    - memory-heavy compilation, packaging and browser or integration suites that fit the Heavy guarantees
    - Docker jobs whose declared requirements exceed Docker but fit Heavy
    exclusions:
    - workloads requiring more than 4 vCPU, 7168 MiB memory or 20480 MiB usable disk; use an external runner or reduce requirements
  deprecation:
    deprecated: false
    announcedAt: null
    sunsetAt: null
    replacementLabel: null
